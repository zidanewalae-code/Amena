name: Sprint9 CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend deps
        run: npm ci
      - name: Run backend unit/integration tests
        env:
          DB_DIALECT: sqlite
          DB_STORAGE: ':memory:'
          JWT_SECRET: ci_secret
          PAYMENT_WEBHOOK_SECRET: change_me
          APP_ENV: test
        run: npm test -- --runInBand

  backend-load:
    runs-on: ubuntu-latest
    needs: backend-tests
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend deps
        run: npm ci
      - name: Seed sqlite database
        env:
          DB_DIALECT: sqlite
          DB_STORAGE: ./ci-load.sqlite
          JWT_SECRET: ci_secret
          PAYMENT_WEBHOOK_SECRET: change_me
        run: npm run seed:reset
      - name: Start backend API
        env:
          DB_DIALECT: sqlite
          DB_STORAGE: ./ci-load.sqlite
          JWT_SECRET: ci_secret
          PAYMENT_WEBHOOK_SECRET: change_me
        run: |
          nohup node server.js > backend.log 2>&1 &
          echo $! > backend.pid
          for i in {1..40}; do
            if curl -fsS http://localhost:5000/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not start in time"
          cat backend.log || true
          exit 1
      - name: Run Sprint 9 load harness
        env:
          LOAD_API_BASE_URL: http://localhost:5000
          LOAD_PAYMENT_WEBHOOK_SECRET: change_me
          LOAD_ITERATIONS: 24
          LOAD_CONCURRENCY: 6
        run: npm run test:load
      - name: Stop backend API
        if: always()
        run: |
          if [ -f backend.pid ]; then
            kill $(cat backend.pid) || true
          fi

  web-e2e:
    runs-on: ubuntu-latest
    needs: backend-tests
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            web/package-lock.json
      - name: Install backend deps
        run: cd ../backend && npm ci
      - name: Install web deps
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run orchestrated Playwright E2E (desktop/tablet/mobile)
        env:
          DB_DIALECT: sqlite
          DB_STORAGE: ../backend/ci-web.sqlite
          JWT_SECRET: ci_secret
          PAYMENT_WEBHOOK_SECRET: change_me
          E2E_PAYMENT_WEBHOOK_SECRET: change_me
        run: npm run test:e2e:orchestrated

  mobile-e2e:
    runs-on: ubuntu-latest
    needs: backend-tests
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile deps
        run: npm ci
      - name: Run mobile integration/e2e suite
        run: npm run test:e2e
